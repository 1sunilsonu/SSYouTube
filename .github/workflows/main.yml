name: Build SSYouTube APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure SSYouTube Name
        run: |
          sed -i 's/ScreenHeader(title = "YTXTube"/ScreenHeader(title = "SSYouTube"/g' app/src/main/java/com/tensei/ytxtube/Screens.kt
          sed -i 's/<string name="app_name">YTXTube<\/string>/<string name="app_name">SSYouTube<\/string>/g' app/src/main/res/values/strings.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SSYouTube-APK
          path: app/build/outputs/apk/debug/*.apk
          

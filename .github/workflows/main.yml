name: Generate Custom Key

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Encrypted Keystore
        run: |
          keytool -genkeypair -v -keystore ssyoutube.jks -keyalg RSA -keysize 2048 -validity 10000 -alias ssyoutube -storepass Sunil1234 -keypass Sunil1234 -dname "CN=Sunil Sonu, O=SSYouTube, C=IN"
          openssl enc -aes-256-cbc -pbkdf2 -salt -in ssyoutube.jks -out ssyoutube.jks.enc -pass pass:Sunil1234

      - name: Upload Encrypted Key
        uses: actions/upload-artifact@v4
        with:
          name: SSYouTube-Key
          path: ssyoutube.jks.enc
          
